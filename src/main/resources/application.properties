spring.application.name=vricciardi-tallerlp3-2026

# H2 en archivo: los datos sobreviven al reinicio del proceso.
spring.datasource.url=jdbc:h2:file:./data/cs2
spring.datasource.username=sa
spring.datasource.password=

# JPA crea/actualiza el esquema a partir de las entidades (perfil de desarrollo).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

server.port=8081

# Consola web para ver la tabla armas en http://localhost:8081/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# POO-09: URLs de los compañeros, externalizables por variables de entorno.
companeros.a2-base-url=${A2_BASE_URL:http://10.30.17.117:8081}
companeros.a3-base-url=${A3_BASE_URL:http://10.30.17.157:8080}
companeros.timeout=${COMPANEROS_TIMEOUT:5s}

# OpenAPI propio: /v3/api-docs y /swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html

logging.level.py.edu.uc.lp3.rest.controller.EscenarioCruzadoController=DEBUG
logging.level.py.edu.uc.lp3.service.impl.EscenarioCruzadoServiceImpl=DEBUG
logging.level.py.edu.uc.lp3.service.impl.CompaneroRestClient=DEBUG
logging.level.py.edu.uc.lp3.service.impl.RegistroJugadaService=DEBUG
