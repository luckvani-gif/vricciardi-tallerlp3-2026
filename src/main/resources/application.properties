spring.application.name=vricciardi-tallerlp3-2026

# H2 en archivo: los datos sobreviven al reinicio del proceso.
spring.datasource.url=jdbc:h2:file:./data/cs2
spring.datasource.username=sa
spring.datasource.password=

# JPA crea/actualiza el esquema a partir de las entidades (perfil de desarrollo).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Consola web para ver la tabla armas en http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
